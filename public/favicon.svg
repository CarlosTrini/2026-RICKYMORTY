<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="portalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a3ff00" />
      <stop offset="55%" stop-color="#39ff14" />
      <stop offset="80%" stop-color="#00d26a" />
      <stop offset="95%" stop-color="#008050" />
      <stop offset="100%" stop-color="#031031" />
    </radialGradient>
    <radialGradient id="cyanSpark" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00b5cc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#031031" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo dimensional oscuro -->
  <circle cx="32" cy="32" r="30" fill="#031031" stroke="#39ff14" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Base del vórtice del portal -->
  <circle cx="32" cy="32" r="27" fill="url(#portalCore)" filter="url(#portalGlow)" />
  <circle cx="32" cy="32" r="27" fill="url(#cyanSpark)" />

  <!-- Remolinos espirales de plasma dimensional -->
  <path d="M32 10C42 10 50 18 50 28C50 36 43 42 35 42C29 42 24 37 24 32C24 28 27 25 31 25C34 25 36 27 36 30C36 32 34 34 32 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M22 15C15 20 12 29 15 37C18 45 27 50 36 49C43 48 48 43 48 37C48 32 44 28 39 28C35 28 32 30 32 34" stroke="#a3ff00" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M12 34C12 44 20 52 30 52C39 52 46 46 47 38C48 31 43 25 36 24C31 23 27 26 26 30" stroke="#00ffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M46 18C51 24 51 33 47 40C43 47 35 51 27 49C20 47 16 41 16 35C16 30 19 26 24 25" stroke="#97ce4c" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Gotas y destellos de energía radiactiva -->
  <circle cx="21" cy="20" r="2.2" fill="#ffffff" />
  <circle cx="43" cy="23" r="1.8" fill="#a3ff00" />
  <circle cx="41" cy="42" r="2.5" fill="#00ffff" />
  <circle cx="23" cy="43" r="2" fill="#39ff14" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#portalGlow)" />
</svg>
